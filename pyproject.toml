[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "An opinionated evaluation framework for RAG pipelines — drop in your retriever, embeddings, and LLM, and get reproducible benchmarks across faithfulness, retrieval precision, latency, and cost."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "rag-eval-harness contributors" }]
keywords = [
    "rag",
    "llm",
    "evaluation",
    "claude",
    "anthropic",
    "retrieval",
    "vector-search",
    "ragas",
    "faithfulness",
    "benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
mongo = [
    "motor>=3.3",
    "openai>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
rag-eval = "rag_eval_harness.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/rag-eval-harness"
Issues = "https://github.com/yourname/rag-eval-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "RUF", "SIM", "TCH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"examples/**" = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/rag_eval_harness"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
